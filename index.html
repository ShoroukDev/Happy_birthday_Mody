<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday Mody ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* لضبط الارتفاع الدقيق على متصفحات الموبايل */
      overflow: hidden;
      background-color: #02010a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* شاشة الضغط للبدء */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      cursor: pointer;
      background: rgba(2, 1, 10, 0.8);
      transition: opacity 0.8s ease, visibility 0.8s;
      padding: 20px;
    }

    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* شعاع/دائرة ضوئية بيضاء متوهجة */
    .glowing-orb {
      width: 65px;
      height: 65px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 
        0 0 15px #ffffff,
        0 0 30px #ffffff,
        0 0 50px #ff77aa,
        0 0 80px #ff0055;
      margin-bottom: 25px;
      animation: orbPulse 1.8s infinite ease-in-out;
    }

    .tap-text {
      color: #ffffff;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px #ff0055;
      opacity: 0.9;
      text-align: center;
    }

    @keyframes orbPulse {
      0% {
        transform: scale(0.85);
        box-shadow: 
          0 0 10px #ffffff,
          0 0 20px #ffffff,
          0 0 35px #ff77aa,
          0 0 60px #ff0055;
      }
      50% {
        transform: scale(1.15);
        box-shadow: 
          0 0 25px #ffffff,
          0 0 45px #ffffff,
          0 0 70px #ff77aa,
          0 0 100px #ff0055;
      }
      100% {
        transform: scale(0.85);
        box-shadow: 
          0 0 10px #ffffff,
          0 0 20px #ffffff,
          0 0 35px #ff77aa,
          0 0 60px #ff0055;
      }
    }

    /* نص التهنيئة في منتصف القلب متجاوب تماماً */
    #text-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      color: #ffffff;
      font-size: clamp(1.3rem, 6vw, 2.6rem);
      font-weight: 800;
      text-shadow: 
        0 0 10px #ff0055, 
        0 0 20px #ff0055, 
        0 0 35px #ff0077,
        0 0 55px #ff00aa;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      white-space: normal; /* السماح بضبط النص تلقائياً للشاشات الضيقة */
      width: 90%;
      max-width: 600px;
      opacity: 0;
      transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #text-container.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      animation: glowPulse 1.8s infinite alternate ease-in-out;
    }

    @keyframes glowPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.96);
        text-shadow: 0 0 15px #ff0055, 0 0 25px #ff0055;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.05);
        text-shadow: 0 0 20px #ff0077, 0 0 40px #ff00aa, 0 0 65px #ff00dd;
      }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <audio id="bg-music" src="song.mpeg" loop></audio>

  <div id="start-screen">
    <div class="glowing-orb"></div>
    <div class="tap-text">المس النور للبدء ❤️✨</div>
  </div>

  <div id="text-container">كل سنة وأنت طيب يا مودي ❤️✨</div>

  <script>
    // --- 1. إعداد المشهد والكاميرا ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // --- 2. خلفية النجوم ---
    const starsCount = 600;
    const starsGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starsCount * 3);

    for (let i = 0; i < starsCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 30;
    }

    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({
      color: 0xffb7d5,
      size: 0.04,
      transparent: true,
      opacity: 0.5
    });
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // --- 3. تصميم شكل القلب (Parametric Heart Curve) ---
    function generateHeartPoints(totalPoints) {
      const points = [];
      for (let i = 0; i <= totalPoints; i++) {
        const t = (i / totalPoints) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        points.push(new THREE.Vector3(x * 0.12, y * 0.12, 0));
      }
      return points;
    }

    const fullPoints = generateHeartPoints(250);
    const heartGroup = new THREE.Group();
    const numRings = 15;
    const heartLines = [];

    // حساب حجم القلب وبعد الكاميرا ديناميكياً ليكون مريحاً على الموبايل واللابتوب
    function updateLayoutForDevice() {
      const aspect = window.innerWidth / window.innerHeight;
      
      // إذا كانت الشاشة طولية (موبايل) نضبط مقياس القلب وبعد الكاميرا
      if (aspect < 1) {
        camera.position.z = 6.2; // إبعاد الكاميرا قليلاً للشاشات الطولية
        return 0.72; // حجم القلب المريح للموبايل
      } else {
        camera.position.z = 5.0; // الوضع الطبيعي للشاشات العريضة
        return 1.25;
      }
    }

    let baseScale = updateLayoutForDevice();

    for (let i = 0; i < numRings; i++) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(fullPoints.length * 3);
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setDrawRange(0, 0);

      const material = new THREE.LineBasicMaterial({
        color: new THREE.Color().setHSL(0.95 - (i * 0.015), 1, 0.55),
        linewidth: 2
      });

      const line = new THREE.Line(geometry, material);
      const ringScale = baseScale * (1 + (i * 0.09));
      line.scale.set(ringScale, ringScale, ringScale);
      line.position.z = -i * 0.12;

      heartLines.push({
        line: line,
        geometry: geometry,
        fullPoints: fullPoints,
        ringRatio: 1 + (i * 0.09)
      });

      heartGroup.add(line);
    }

    scene.add(heartGroup);

    // --- 4. قصاصات الورق الملونة (Confetti) ---
    const confettiCount = 150;
    const confettiGeometry = new THREE.BufferGeometry();
    const confettiPos = new Float32Array(confettiCount * 3);
    const confettiVel = [];

    for (let i = 0; i < confettiCount; i++) {
      confettiPos[i * 3] = (Math.random() - 0.5) * 14;
      confettiPos[i * 3 + 1] = Math.random() * 10 + 5;
      confettiPos[i * 3 + 2] = (Math.random() - 0.5) * 5;

      confettiVel.push({
        y: -(Math.random() * 0.03 + 0.02),
        x: (Math.random() - 0.5) * 0.01
      });
    }

    confettiGeometry.setAttribute('position', new THREE.BufferAttribute(confettiPos, 3));
    const confettiMaterial = new THREE.PointsMaterial({
      size: 0.08,
      color: 0xffe600,
      transparent: true,
      opacity: 0.9
    });
    const confettiSystem = new THREE.Points(confettiGeometry, confettiMaterial);
    scene.add(confettiSystem);

    // --- 5. نظام الألعاب النارية (Fireworks) ---
    const fireworks = [];

    class Firework {
      constructor(x, y, z) {
        this.particleCount = 80;
        this.geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(this.particleCount * 3);
        this.velocities = [];
        const color = new THREE.Color().setHSL(Math.random(), 1, 0.65);

        for (let i = 0; i < this.particleCount; i++) {
          positions[i * 3] = x;
          positions[i * 3 + 1] = y;
          positions[i * 3 + 2] = z;

          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          const speed = 0.04 + Math.random() * 0.05;

          this.velocities.push({
            x: Math.sin(phi) * Math.cos(theta) * speed,
            y: Math.sin(phi) * Math.sin(theta) * speed,
            z: Math.cos(phi) * speed
          });
        }

        this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        this.material = new THREE.PointsMaterial({
          color: color,
          size: 0.07,
          transparent: true,
          opacity: 1
        });

        this.mesh = new THREE.Points(this.geometry, this.material);
        scene.add(this.mesh);
        this.life = 0;
        this.maxLife = 40;
      }

      update() {
        const positions = this.geometry.attributes.position.array;
        for (let i = 0; i < this.particleCount; i++) {
          positions[i * 3] += this.velocities[i].x;
          positions[i * 3 + 1] += this.velocities[i].y;
          positions[i * 3 + 2] += this.velocities[i].z;
          this.velocities[i].y -= 0.001;
        }
        this.geometry.attributes.position.needsUpdate = true;
        this.life++;
        this.material.opacity = 1 - (this.life / this.maxLife);

        if (this.life >= this.maxLife) {
          scene.remove(this.mesh);
          this.geometry.dispose();
          this.material.dispose();
          return false;
        }
        return true;
      }
    }

    function createRandomFirework() {
      const fx = (Math.random() - 0.5) * 8;
      const fy = (Math.random() - 0.5) * 6;
      const fz = -1 - Math.random() * 2;
      fireworks.push(new Firework(fx, fy, fz));
    }

    // --- 6. التحكم في الحركة والتشغيل بالضغط ---
    let time = 0;
    let drawProgress = 0;
    const drawSpeed = 2.5;
    let isDrawingStarted = false;
    let isDrawComplete = false;

    const startScreen = document.getElementById('start-screen');
    const bgMusic = document.getElementById('bg-music');

    // الضغط لبدء الرسم وتشغيل الموسيقى
    startScreen.addEventListener('click', () => {
      if (!isDrawingStarted) {
        isDrawingStarted = true;
        startScreen.classList.add('hidden');
        
        if (bgMusic) {
          bgMusic.play().catch(e => console.log("تعذر تشغيل الصوت أوتوماتيكياً: ", e));
        }

        createRandomFirework();
      }
    });

    // إطلاق ألعاب نارية عند الضغط على الشاشة بعد البدء
    window.addEventListener('pointerdown', (e) => {
      if (isDrawingStarted && e.target.id !== 'start-screen') {
        const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        fireworks.push(new Firework(mouseX * 3.5, mouseY * 3, 0));
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      time += 0.03;

      if (isDrawingStarted && !isDrawComplete) {
        drawProgress += drawSpeed;
        
        heartLines.forEach((item) => {
          const positions = item.geometry.attributes.position.array;
          const count = Math.min(Math.floor(drawProgress), item.fullPoints.length);

          for (let i = 0; i < count; i++) {
            positions[i * 3] = item.fullPoints[i].x;
            positions[i * 3 + 1] = item.fullPoints[i].y;
            positions[i * 3 + 2] = 0;
          }

          item.geometry.attributes.position.needsUpdate = true;
          item.geometry.setDrawRange(0, count);
        });

        if (drawProgress >= fullPoints.length) {
          isDrawComplete = true;
          document.getElementById('text-container').classList.add('show');
        }
      } else if (isDrawComplete) {
        const pulse = 1 + Math.sin(time * 3.5) * 0.05;
        heartGroup.scale.set(pulse, pulse, pulse);
        heartGroup.rotation.y = Math.sin(time * 0.5) * 0.08;

        if (Math.random() < 0.05) {
          createRandomFirework();
        }
      }

      // تحديث الألعاب النارية
      for (let i = fireworks.length - 1; i >= 0; i--) {
        if (!fireworks[i].update()) {
          fireworks.splice(i, 1);
        }
      }

      // تحديث القصاصات
      if (isDrawingStarted) {
        const cPos = confettiGeometry.attributes.position.array;
        for (let i = 0; i < confettiCount; i++) {
          cPos[i * 3 + 1] += confettiVel[i].y;
          cPos[i * 3] += confettiVel[i].x;

          if (cPos[i * 3 + 1] < -5) {
            cPos[i * 3 + 1] = 6;
            cPos[i * 3] = (Math.random() - 0.5) * 14;
          }
        }
        confettiGeometry.attributes.position.needsUpdate = true;
      }

      starField.rotation.y += 0.0008;
      renderer.render(scene, camera);
    }

    // إعادة ضبط الأبعاد تلقائياً عند تغيير حجم النافذة أو تدوير الهاتف
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      baseScale = updateLayoutForDevice();
      heartLines.forEach((item) => {
        const ringScale = baseScale * item.ringRatio;
        item.line.scale.set(ringScale, ringScale, ringScale);
      });
    });

    animate();
  </script>
</body>
</html>
